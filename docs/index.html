<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Match 3 - Drift Edition Classic</title>
    <style>
        body { 
            margin: 0; display: flex; justify-content: center; align-items: center; 
            height: 100vh; background: #222; flex-direction: column;
            font-family: sans-serif; color: white; overflow: hidden;
        }
        #game-container { position: relative; overflow: hidden; border: 4px solid rgba(255, 255, 255, 0.2); border-radius: 10px; }
        #background-image { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: -1; opacity: 0.8; }
        
        .tile {
            position: absolute; width: 42px; height: 42px; border-radius: 50%; cursor: pointer;
            transition: transform 0.3s cubic-bezier(0.25, 0.1, 0.25, 1), opacity 0.3s ease-out;
            display: flex; justify-content: center; align-items: center;
            z-index: 5;
            background-image: url('blue.jpg'); /* Твой исходный ассет */
            background-size: cover;
            background-position: center;
        }

        /* Цветовые фильтры, чтобы отличать детали без разных картинок */
        .tile::after {
            content: '';
            position: absolute; width: 100%; height: 100%; border-radius: 50%;
            background-color: currentColor; mix-blend-mode: color; opacity: 0.8;
        }

        .tile.selected { 
            transform: translate(calc(var(--posX) - 50%), calc(var(--posY) - 50%)) scale(1.1) !important; 
            box-shadow: 0 0 20px white;
            z-index: 10;
        }

        #score-board, #moves-board {
            position: absolute; padding: 10px; background: rgba(0, 0, 0, 0.6); border-radius: 5px;
            font-size: 20px; z-index: 10; text-align: center; pointer-events: none;
        }
        #score-board { top: 10px; left: 10px; right: 10px; font-size: 24px; }
        #moves-board { bottom: 20px; left: 50%; transform: translateX(-50%); min-width: 150px; }
        #board-bg { position: absolute; background: rgba(20, 20, 20, 0.4); border-radius: 8px; z-index: 1; }

        #game-over-screen {
            display: none; position: absolute; inset: 0;
            background: rgba(0, 0, 0, 0.9); z-index: 100; justify-content: center; align-items: center;
            flex-direction: column; text-align: center;
        }
        #game-over-screen h1 { font-size: 48px; margin-bottom: 10px; }
        #game-over-screen button { padding: 15px 30px; font-size: 24px; cursor: pointer; border-radius: 10px; border: none; background: #4CAF50; color: white; }
        .win-text { color: #4CAF50; }
        .lose-text { color: #F44336; }
    </style>
</head>
<body>

<div id="game-container">
    <img id="background-image" src="background.jpeg">
    <div id="score-board">Счет: 0 / Цель: 1000</div>
    <div id="board-bg"></div>
    <div id="moves-board">Ходы: 20</div>
    
    <div id="game-over-screen">
        <h1 id="game-over-title">Игра окончена!</h1>
        <p id="final-score">Ваш счет: 0</p>
        <button onclick="location.reload()">Играть снова</button>
    </div>
</div>

<script>
const CONFIG = { width: 400, height: 600 };
const GRID_SIZE = 7;
const CELL_SIZE = 48; 
const COLORS = ['#fc0822', '#c800ff', '#054df2', '#03ffe5', '#02c402'];
const MAX_MOVES = 20;
const WIN_SCORE = 1000;

let grid = [];
let selectedTile = null;
let canMove = true;
let score = 0;
let moves = MAX_MOVES;

const gameContainer = document.getElementById('game-container');
const scoreText = document.getElementById('score-board');
const movesText = document.getElementById('moves-board');
const gameOverScreen = document.getElementById('game-over-screen');

gameContainer.style.width = `${CONFIG.width}px`;
gameContainer.style.height = `${CONFIG.height}px`;

const startX = (CONFIG.width - (GRID_SIZE * CELL_SIZE)) / 2 + CELL_SIZE / 2;
const startY = 130 + CELL_SIZE / 2;

const boardBg = document.getElementById('board-bg');
boardBg.style.width = `${GRID_SIZE * CELL_SIZE + 10}px`;
boardBg.style.height = `${GRID_SIZE * CELL_SIZE + 10}px`;
boardBg.style.left = `${startX - CELL_SIZE / 2 - 5}px`; 
boardBg.style.top = `${startY - CELL_SIZE / 2 - 5}px`;

function getTilePosition(x, y) {
    return { x: startX + x * CELL_SIZE, y: startY + y * CELL_SIZE };
}

function updateTileTransform(tile) {
    const pos = getTilePosition(tile.gridX, tile.gridY);
    tile.style.setProperty('--posX', `${pos.x}px`);
    tile.style.setProperty('--posY', `${pos.y}px`);
    tile.style.transform = `translate(calc(var(--posX) - 50%), calc(var(--posY) - 50%))`;
}

function createTile(x, y, isInitial = false) {
    const tile = document.createElement('div');
    tile.classList.add('tile');
    tile.gridX = x; 
    tile.gridY = y;
    
    // Подбор цвета без совпадений при старте
    let validColors = [...COLORS];
    if (isInitial) {
        if (x > 1 && grid[y][x-1] && grid[y][x-2] && grid[y][x-1].color === grid[y][x-2].color) {
            validColors = validColors.filter(c => c !== grid[y][x-1].color);
        }
        if (y > 1 && grid[y-1][x] && grid[y-2][x] && grid[y-1][x].color === grid[y-2][x].color) {
            validColors = validColors.filter(c => c !== grid[y-1][x].color);
        }
    }
    tile.color = validColors[Math.floor(Math.random() * validColors.length)];
    tile.style.color = tile.color;

    const targetPos = getTilePosition(x, y);
    const startYPos = isInitial ? targetPos.y : targetPos.y - 400;
    
    tile.style.setProperty('--posX', `${targetPos.x}px`);
    tile.style.setProperty('--posY', `${startYPos}px`);
    tile.style.transform = `translate(calc(var(--posX) - 50%), calc(var(--posY) - 50%))`;
    
    tile.onclick = () => onTileClick(tile);
    gameContainer.appendChild(tile);
    grid[y][x] = tile;
    
    if (!isInitial) setTimeout(() => updateTileTransform(tile), 50);
    return tile;
}

function onTileClick(tile) {
    if (!canMove) return;
    if (selectedTile) {
        let dx = Math.abs(tile.gridX - selectedTile.gridX);
        let dy = Math.abs(tile.gridY - selectedTile.gridY);
        if ((dx === 1 && dy === 0) || (dx === 0 && dy === 1)) {
            executeSwap(selectedTile, tile);
        }
        selectedTile.classList.remove('selected');
        selectedTile = null;
    } else {
        selectedTile = tile;
        selectedTile.classList.add('selected');
    }
}

async function executeSwap(t1, t2, isReverse = false) {
    canMove = false;
    const x1 = t1.gridX, y1 = t1.gridY, x2 = t2.gridX, y2 = t2.gridY;
    
    grid[y1][x1] = t2; grid[y2][x2] = t1;
    t1.gridX = x2; t1.gridY = y2;
    t2.gridX = x1; t2.gridY = y1;

    updateTileTransform(t1); updateTileTransform(t2);
    await new Promise(r => setTimeout(r, 300));

    const matches = checkMatches();
    if (matches.length > 0) {
        if (!isReverse) moves--;
        await processMatches(matches);
    } else if (!isReverse) {
        await executeSwap(t1, t2, true);
    }
    
    checkGameOver();
    canMove = true;
}

function checkMatches() {
    let matches = new Set();
    for (let y = 0; y < GRID_SIZE; y++) {
        for (let x = 0; x < GRID_SIZE - 2; x++) {
            if (grid[y][x] && grid[y][x+1] && grid[y][x+2] &&
                grid[y][x].color === grid[y][x+1].color && grid[y][x].color === grid[y][x+2].color) {
                matches.add(grid[y][x]); matches.add(grid[y][x+1]); matches.add(grid[y][x+2]);
            }
        }
    }
    for (let x = 0; x < GRID_SIZE; x++) {
        for (let y = 0; y < GRID_SIZE - 2; y++) {
            if (grid[y][x] && grid[y+1][x] && grid[y+2][x] &&
                grid[y][x].color === grid[y+1][x].color && grid[y][x].color === grid[y+2][x].color) {
                matches.add(grid[y][x]); matches.add(grid[y+1][x]); matches.add(grid[y+2][x]);
            }
        }
    }
    return Array.from(matches);
}

async function processMatches(matchList) {
    matchList.forEach(tile => {
        tile.style.opacity = '0';
        tile.style.transform += ' scale(0)';
        score += 10;
        grid[tile.gridY][tile.gridX] = null;
    });

    await new Promise(r => setTimeout(r, 300));
    matchList.forEach(tile => tile.remove());
    
    updateUI();
    await fillGaps();
    
    const next = checkMatches();
    if (next.length > 0) await processMatches(next);
}

async function fillGaps() {
    for (let x = 0; x < GRID_SIZE; x++) {
        let gaps = 0;
        for (let y = GRID_SIZE - 1; y >= 0; y--) {
            if (grid[y][x] === null) gaps++;
            else if (gaps > 0) {
                grid[y+gaps][x] = grid[y][x];
                grid[y][x] = null;
                grid[y+gaps][x].gridY += gaps;
                updateTileTransform(grid[y+gaps][x]);
            }
        }
        for (let i = 0; i < gaps; i++) createTile(x, i);
    }
    await new Promise(r => setTimeout(r, 400));
}

function updateUI() {
    scoreText.textContent = `Счет: ${score} / Цель: ${WIN_SCORE}`;
    movesText.textContent = `Ходы: ${moves}`;
}

function checkGameOver() {
    if (score >= WIN_SCORE || moves <= 0) {
        canMove = false;
        gameOverScreen.style.display = 'flex';
        document.getElementById('final-score').textContent = `Ваш счет: ${score}`;
        const title = document.getElementById('game-over-title');
        if (score >= WIN_SCORE) {
            title.textContent = "ПОБЕДА!";
            title.className = "win-text";
        } else {
            title.textContent = "ХОДЫ ЗАКОНЧИЛИСЬ";
            title.className = "lose-text";
        }
    }
}

// Запуск игры
for (let y = 0; y < GRID_SIZE; y++) {
    grid[y] = [];
    for (let x = 0; x < GRID_SIZE; x++) createTile(x, y, true);
}
updateUI();
</script>
</body>
</html>
